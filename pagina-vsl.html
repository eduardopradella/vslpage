<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>[TÍTULO DA PÁGINA]</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--tx:#f2f2f2;--mu:#a8a8a8;--hl:#ffd60a;--cta:#16a34a;--cta2:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:400 18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));min-height:100vh}
.w{max-width:760px;margin:0 auto;text-align:center}
h1{font-size:clamp(28px,7vw,48px);line-height:1.12;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px}
.sub{color:var(--mu);font-size:clamp(16px,4vw,20px);margin-bottom:22px}
.hl{color:var(--hl);font-weight:800}
mark{background:none;color:var(--hl);font-weight:700}
.vw{position:relative;aspect-ratio:16/9;background:#0b0b0b;border:1px solid #222;border-radius:10px;overflow:hidden;margin:0 auto 22px}
.vw video{width:100%;height:100%;display:block;object-fit:cover}
#snd{position:absolute;inset:0;width:100%;border:0;cursor:pointer;background:rgba(0,0,0,.45);color:#fff;font:700 clamp(16px,4.5vw,24px)/1.3 inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#snd span{background:var(--hl);color:#000;padding:12px 20px;border-radius:999px}
#snd.off{display:none}
.t{text-align:left;margin:0 auto 22px}
.t p{margin-bottom:18px}
.t h2{font-size:clamp(22px,5.5vw,30px);line-height:1.2;margin:28px 0 12px}
.cta{display:block;visibility:hidden;opacity:0;transition:opacity .5s;margin:0 auto;max-width:560px}
.cta.on{visibility:visible;opacity:1}
.btn{display:block;background:var(--cta);color:#fff;text-decoration:none;font-weight:800;font-size:clamp(18px,5vw,24px);padding:18px 20px;border-radius:10px;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:p 2s infinite}
.btn:hover,.btn:focus-visible{background:var(--cta2);outline:2px solid #fff;outline-offset:3px}
.btn small{display:block;font-weight:500;font-size:.62em;opacity:.9;margin-top:2px}
@keyframes p{70%{box-shadow:0 0 0 14px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.ft{margin-top:36px;color:#6f6f6f;font-size:12px;line-height:1.5}
.ft a{color:#8a8a8a}
@media(prefers-reduced-motion:reduce){.btn{animation:none}.cta{transition:none}}
</style>
<script>
/* ===== CONFIGURAÇÃO (preencher) ===== */
var CFG={
 variant:"vsl",                 // vsl | tsl (identifica a variante no teste A/B)
 gtm:"GTM-XXXXXXX",                     // ID do GTM
 ga4:"",                                // G-XXXXXXXXXX → deixar vazio se o GA4 já disparar dentro do GTM (evita PageView duplicado)
 pixel:"000000000000000",               // ID do Pixel da Meta
 utmify:"",                             // ID do pixel da Utmify
 checkout:"https://[LINK-DO-CHECKOUT]", // link de checkout / página seguinte
 videoSrc:"[URL-DO-VIDEO].mp4",         // vídeo MP4 (ou HLS) – só VSL
 ctaDelay:30                      // segundos até o botão aparecer
};
/* ==================================== */
var ok=function(v){return v&&!/X{4}|^0+$/.test(v)};
window.dataLayer=window.dataLayer||[];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
/* guarda UTMs/click ids (1.º toque) */
(function(){var K=["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid","gclid","src","sck","xcod"],q=new URLSearchParams(location.search),s={};
try{s=JSON.parse(sessionStorage.getItem("trk")||"{}")}catch(e){}
K.forEach(function(k){if(q.get(k))s[k]=q.get(k)});
try{sessionStorage.setItem("trk",JSON.stringify(s))}catch(e){}window.TRK=s})();
dataLayer.push({event:"page_variant",page_variant:CFG.variant});
/* GTM */
if(ok(CFG.gtm)){(function(w,d,s,l,i){w[l].push({"gtm.start":Date.now(),event:"gtm.js"});var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;j.src="https://www.googletagmanager.com/gtm.js?id="+i;f.parentNode.insertBefore(j,f)})(window,document,"script","dataLayer",CFG.gtm)}
/* GA4 direto (opcional) */
if(ok(CFG.ga4)){var g=document.createElement("script");g.async=true;g.src="https://www.googletagmanager.com/gtag/js?id="+CFG.ga4;document.head.appendChild(g);window.gtag=function(){dataLayer.push(arguments)};gtag("js",new Date());gtag("config",CFG.ga4,{page_variant:CFG.variant})}
/* Pixel Meta */
if(ok(CFG.pixel)){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
fbq("init",CFG.pixel);window.PVID=uid();fbq("track","PageView",{},{eventID:window.PVID});}
/* Utmify */
if(ok(CFG.utmify)){window.pixelId=CFG.utmify;var a=document.createElement("script");a.async=true;a.defer=true;a.src="https://cdn.utmify.com.br/scripts/pixel/pixel.js";document.head.appendChild(a)}
var u=document.createElement("script");u.async=true;u.defer=true;u.src="https://cdn.utmify.com.br/scripts/utms/latest.js";u.setAttribute("data-utmify-prevent-xcod-sck","");u.setAttribute("data-utmify-prevent-subids","");document.head.appendChild(u);
function ev(n,p){var id=uid();if(window.fbq)fbq("trackCustom",n,p||{},{eventID:id});dataLayer.push({event:n,page_variant:CFG.variant})}
</script>
</head>
<body>
<main class="w">
<h1>Descubra como <span class="hl">[RESULTADO]</span> em <span class="hl">[PRAZO]</span> sem <span class="hl">[OBJEÇÃO]</span></h1>
<p class="sub">Veja o vídeo até ao fim: o <mark>método</mark> é mostrado só aqui.</p>
<div class="vw"><video id="v" muted playsinline preload="none" disablepictureinpicture controlslist="nodownload noplaybackrate"></video>
<button id="snd" type="button" aria-label="Ativar o som do vídeo"><span>🔊 Toque para ativar o som</span></button></div>
<a id="cta" class="cta" href="#"><span class="btn">[TEXTO DO BOTÃO]<small>[MICROCOPY: ex. Acesso imediato · Garantia de 7 dias]</small></span></a>
<p class="ft">[NOME DA EMPRESA] · <a href="#">Termos</a> · <a href="#">Privacidade</a><br>[AVISO LEGAL: resultados podem variar de pessoa para pessoa.]</p>
</main>
<script>
(function(){
var cta=document.getElementById("cta"),shown=0;
/* propaga UTMs + click ids para o checkout */
function link(){try{var u=new URL(CFG.checkout),q=new URLSearchParams(location.search);
q.forEach(function(v,k){u.searchParams.set(k,v)});
for(var k in (window.TRK||{}))if(!u.searchParams.has(k))u.searchParams.set(k,TRK[k]);
var m=document.cookie.match(/_fbp=([^;]+)/),c=document.cookie.match(/_fbc=([^;]+)/);
if(m)u.searchParams.set("fbp",m[1]);if(c)u.searchParams.set("fbc",c[1]);
return u.toString()}catch(e){return CFG.checkout}}
function show(){if(shown)return;shown=1;cta.classList.add("on");ev("CtaVisivel");if(window.fbq)fbq("track","ViewContent",{content_name:CFG.variant})}
cta.addEventListener("click",function(e){e.preventDefault();var h=link();
if(window.fbq)fbq("track","InitiateCheckout",{content_name:CFG.variant},{eventID:uid()});
dataLayer.push({event:"cta_click",page_variant:CFG.variant});setTimeout(function(){location.href=h},180)});
cta.href=CFG.checkout;
var v=document.getElementById("v"),b=document.getElementById("snd"),go=0;
function load(){v.src=CFG.videoSrc;var p=v.play();if(p&&p.catch)p.catch(function(){})}
if(document.readyState==="complete")load();else addEventListener("load",load);
b.addEventListener("click",function(){b.classList.add("off");v.currentTime=0;v.muted=false;v.play();ev("VideoSomAtivado")});
v.addEventListener("play",function(){if(!go){go=1;ev("VideoPlay")}});
v.addEventListener("timeupdate",function(){if(v.currentTime>=CFG.ctaDelay)show()});
v.addEventListener("error",function(){setTimeout(show,CFG.ctaDelay*1000)});
})();
</script>
</body>
</html>
